# nginx site for assamhealthcare.pk
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/assam_healthcare
#   sudo ln -s /etc/nginx/sites-available/assam_healthcare /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS (certbot edits this file and adds the HTTP -> HTTPS redirect):
#   sudo certbot --nginx -d assamhealthcare.pk -d www.assamhealthcare.pk --redirect

# --- Unwanted traffic ------------------------------------------------------
# Requests per second allowed from one IP address. "burst" lets a real
# visitor load a page with all its images at once; anything beyond is
# answered with 429 Too Many Requests before it reaches Django.
limit_req_zone $binary_remote_addr zone=assam_pages:10m rate=10r/s;
# Form submissions and sign-ins (POST requests only; an empty key is not
# counted): a person never needs more than this.
map $request_method $assam_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $assam_post_key zone=assam_forms:10m rate=10r/m;
limit_req_status 429;

# Open connections allowed from one IP address.
limit_conn_zone $binary_remote_addr zone=assam_conn:10m;

# Don't advertise the nginx version in headers and error pages.
server_tokens off;

# Requests for any other host name (bots scanning the server's IP address)
# are dropped without a response, so they never reach Django.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# www.assamhealthcare.pk -> assamhealthcare.pk (one address for search engines)
server {
    listen 80;
    listen [::]:80;
    server_name www.assamhealthcare.pk;
    return 301 $scheme://assamhealthcare.pk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name assamhealthcare.pk;

    # Compress text responses (Ubuntu's nginx.conf turns gzip on but only
    # for HTML). Set here, not at the top, because "gzip on" is already
    # declared there and nginx refuses duplicates.
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # CVs are up to 5 MB; product images and documents can be larger.
    client_max_body_size 20M;

    # Close connections that send their request very slowly, which ties up
    # the server ("slowloris" attacks).
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn assam_conn 20;

    access_log /var/log/nginx/assam_healthcare.access.log;
    error_log /var/log/nginx/assam_healthcare.error.log;

    # Hidden files (.env, .git) and common scanner targets are never served.
    # /.well-known/ stays open: certbot uses it to renew the certificate.
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    # Static files have content hashes in their names, so they can be
    # cached for a long time.
    location /static/ {
        alias /home/assam/assam_healthcare/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # CVs uploaded through the careers page are never served publicly.
    location /media/careers/ {
        return 404;
    }

    # Uploaded files are shown as files only: an uploaded HTML or SVG file
    # cannot run scripts on this site.
    location /media/ {
        alias /home/assam/assam_healthcare/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox";
    }

    location / {
        limit_req zone=assam_pages burst=40 nodelay;
        limit_req zone=assam_forms burst=5 nodelay;
        proxy_pass http://unix:/run/assam_healthcare/gunicorn.sock;
        proxy_set_header Host $host;
        # Overwrites any X-Real-IP a visitor sends, so Django's rate limits
        # (apps/core/ratelimit.py) always see the true address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}
