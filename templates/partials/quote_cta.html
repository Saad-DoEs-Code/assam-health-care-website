{% comment %}
Closing call to action shared by several pages. Variable: heading.
{% endcomment %}
<section class="bg-white py-16 lg:py-24" aria-labelledby="quote-cta-heading">
    <div class="mx-auto max-w-(--container-page) px-4 sm:px-6 lg:px-8">
        <div class="relative overflow-hidden rounded-[2rem] bg-navy-800 px-6 py-12 sm:px-12 lg:flex lg:items-center lg:justify-between lg:gap-12 lg:px-16 lg:py-16">
            <div class="pointer-events-none absolute -right-24 -bottom-32 size-96 rounded-full bg-teal-600/25 blur-3xl" aria-hidden="true"></div>
            <div class="relative max-w-2xl">
                <p class="text-xs font-bold tracking-[0.16em] text-teal-200 uppercase">Quotation request</p>
                <h2 id="quote-cta-heading" class="mt-3 font-display text-3xl leading-tight font-semibold text-white sm:text-4xl">{{ heading|default:"Ready to request a quotation?" }}</h2>
                <p class="mt-4 text-lg leading-8 text-navy-200">
                    Send one request for several products, or call our office on
                    <a href="{{ company_contact.phone_href }}" class="font-semibold text-white underline decoration-teal-300 underline-offset-4 hover:text-teal-100">{{ company_contact.phone }}</a>.
                </p>
            </div>
            <div class="relative mt-8 flex flex-col gap-3 sm:flex-row lg:mt-0 lg:shrink-0">
                <a href="{% url 'create_inquiry' %}" class="btn btn-accent">Request a Quote</a>
                <a href="{% url 'contact' %}" class="btn border border-white/25 text-white hover:bg-white/10 hover:text-white">Contact us</a>
            </div>
        </div>
    </div>
</section>
